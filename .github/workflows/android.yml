name: Build FUN CAM APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the web app's looks match the Android sources
        run: python3 tools/gen_web_data.py && git diff --exit-code web/data.js
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FUN-CAM.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FUN-CAM-apk
          path: FUN-CAM.apk
      - name: Update the "latest" release (shareable download link)
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FUN CAM — latest build
          prerelease: true
          files: FUN-CAM.apk
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FUN-CAM.apk
