<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUN CAM Dot">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>FUN CAM · DOT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="id">
      <div class="name" id="camName">FUN CAM</div>
      <div class="meta" id="camMeta">DOT EDITION</div>
    </div>
    <button class="rnd" id="bAuto" aria-label="Back to auto"><span>A</span></button>
    <button class="rnd" id="bSettings" aria-label="Settings"></button>
  </header>
  <nav class="quick" id="quick"></nav>
  <div id="vfwrap">
    <div id="vf">
      <canvas id="gl"></canvas>
      <svg id="grid"></svg>
      <div id="level"><i></i></div>
      <canvas id="hist" width="96" height="28"></canvas>
      <button id="slow"></button>
      <div id="rec"><i></i><span>00:00</span></div>
      <button id="zoom">1.0×</button>
      <div id="big"></div>
      <div id="reticle"><i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="r4"></i><div class="sun"><b></b></div></div>
      <div id="blink"></div>
    </div>
  </div>
  <div class="params">
    <div class="ptabs" id="ptabs"></div>
    <div class="pval" id="pval">±0.0</div>
  </div>
  <canvas id="dial"></canvas>
  <div class="tick">
    <button class="mode" id="bMode" aria-label="Photo or video"><span>PHOTO</span><span>VIDEO</span><i></i></button>
    <div class="ticker" id="ticker"></div>
    <button class="rnd" id="bAll" aria-label="All cameras"></button>
  </div>
  <footer class="dock">
    <div class="side">
      <button id="thumb" aria-label="Roll"></button>
      <button class="txt" id="bTune">TUNE</button>
    </div>
    <button id="shutter" aria-label="Shutter"><svg id="ring" viewBox="-60 -60 120 120"></svg><i></i></button>
    <div class="side">
      <button class="rnd big" id="bFlip" aria-label="Flip camera"></button>
      <button class="txt" id="bLens">LENS</button>
    </div>
  </footer>
</div>
<div id="msg"></div>
<div id="start">
  <div class="logo"><span>FUN</span><span>CAM</span><i></i></div>
  <p>51 FILM CAMERAS. LIVE.</p>
  <button id="bStart">OPEN CAMERA</button>
  <p class="err" id="startErr"></p>
</div>
<script type="module" src="ui.js"></script>
</body>
</html>
